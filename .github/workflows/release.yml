# Baut bei jedem neuen Tag (z. B. v1.3.0) den Mod und den Launcher und veröffentlicht ein GitHub-Release
# mit TopClient.exe und TopClient.exe.sha256. Der Launcher findet es dann über "Update launcher".
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version aus dem Tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Mod bauen
        shell: bash
        working-directory: topclient-mod
        run: |
          chmod +x gradlew
          ./gradlew build -Pmod_version="$VERSION" --no-daemon
          JAR=$(ls build/libs/*.jar | grep -v -e sources -e dev | head -n 1)
          echo "Mod-Jar: $JAR"
          cp "$JAR" ../topclient/bundled/TopClient.jar

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Launcher bauen
        shell: bash
        working-directory: topclient
        run: |
          sed -i "s/^const AppVersion = \".*\"/const AppVersion = \"$VERSION\"/" main.go
          grep -n "^const AppVersion" main.go
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o TopClient.exe .
          sha256sum TopClient.exe | cut -d' ' -f1 > TopClient.exe.sha256
          cat TopClient.exe.sha256

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            topclient/TopClient.exe
            topclient/TopClient.exe.sha256
          generate_release_notes: true
